syntax = "proto3";

package monitoring.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "gen/monitoring/v1;monitoringv1";

// =====================================================
// Общие сообщения
// =====================================================

enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_TELEGRAM = 1;
  // RSS/Atom-лента. Одним коннектором закрываются и СМИ, и сайты регуляторов —
  // категория источника это ярлык (Source.label), а не технология парсинга.
  SOURCE_TYPE_RSS = 2;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_STARTED = 1;
  RUN_STATE_DONE = 2;
  RUN_STATE_FAILED = 3;
}

enum FilterType {
  PROMT_BASED = 0;
}

// Категория материала (REQUIREMENTS.md, решение Р5).
enum NewsCategory {
  NEWS_CATEGORY_UNSPECIFIED = 0;
  NEWS_CATEGORY_REGULATORY = 1; // регуляторика
  NEWS_CATEGORY_REPUTATION = 2; // репутация
  NEWS_CATEGORY_COMPETITORS = 3; // конкуренты
  NEWS_CATEGORY_TRENDS = 4; // тренды
}

// Приоритет материала.
enum NewsImportance {
  NEWS_IMPORTANCE_UNSPECIFIED = 0;
  NEWS_IMPORTANCE_HIGH = 1;
  NEWS_IMPORTANCE_MEDIUM = 2;
  NEWS_IMPORTANCE_LOW = 3;
}

// Тип документа: нормативно-правовой акт или новостная статья.
enum DocType {
  DOC_TYPE_UNSPECIFIED = 0;
  DOC_TYPE_NEWS = 1;
  DOC_TYPE_NPA = 2;
}

// =====================================================
// Проекты
// =====================================================

message ProjectFilter {
  FilterType type = 1;
  string prompt = 2;
}

message Source {
  SourceType type = 1;
  string telegram = 2; // когда type == SOURCE_TYPE_TELEGRAM
  string rss_url = 3; // когда type == SOURCE_TYPE_RSS
  // Человекочитаемое имя источника: «ЦБ РФ (регулятор)», «РБК». Несёт категорию
  // источника для UI — отдельного enum категории сознательно нет.
  string label = 4;
  // Источник на паузе: не опрашивается, но не удалён.
  // Именно `disabled`, а не `enabled`: у скаляров proto3 нет presence, пропущенное
  // `enabled` пришло бы как false и молча выключило бы все существующие источники.
  bool disabled = 5;
}

message Project {
  string id = 1;
  string name = 2;
  string topic = 3;
  repeated ProjectFilter filters = 4;
  repeated Source sources = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // За сколько дней собирать материалы при ПЕРВОМ сборе источника. Дальше рулит
  // инкрементальный курсор. 0 = дефолт (7). Диапазон 1..60.
  int32 collection_days = 8;
}

message CreateProjectRequest {
  string name = 1;
  string topic = 2;
  repeated ProjectFilter filters = 3;
  repeated Source sources = 4;
  int32 collection_days = 5;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectResponse {}

message ListProjectsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
}

message UpdateProjectRequest {
  string id = 1;
  string name = 2;
  string topic = 3;
  repeated ProjectFilter filters = 4;
  repeated Source sources = 5;
  google.protobuf.FieldMask update_mask = 6;
  int32 collection_days = 7;
}

message DeleteProjectRequest {
  string id = 1;
}

// =====================================================
// Запуски
// =====================================================

// Сущности события: кто / что / когда / последствия (решение Р5).
message NewsEntities {
  string who = 1;
  string what = 2;
  string when = 3;
  string consequences = 4;
}

// Карточка события: один факт, о котором сообщили один или несколько источников.
message News {
  string title = 1;
  string content = 2;
  repeated string sources = 3;
  int32 id = 4;
  string project_id = 5;
  // Прогон, в котором карточка появилась. Пусто у материалов, добавленных вручную.
  string run_id = 6;
  NewsCategory category = 7;
  NewsImportance importance = 8;
  DocType doc_type = 9;
  NewsEntities entities = 10;
  repeated string tags = 11;
  // Скрыто из ленты. Данные при этом не удаляются.
  bool hidden = 12;
  google.protobuf.Timestamp created_at = 13;
}

// Итоги прогона: сколько собрано, сколько прошло фильтр, сколько новостей получилось.
message RunStats {
  int32 collected = 1;
  int32 relevant = 2;
  int32 news = 3;
  // Заполняется только при RUN_STATE_FAILED.
  string error = 4;
  // Прогресс во время обработки (state == RUN_STATE_STARTED). На терминальном
  // состоянии stage пустой. stage: "filtering" | "composing".
  string stage = 5;
  int32 stage_done = 6;
  int32 stage_total = 7;
}

message Run {
  string id = 1;
  string project_id = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated News news = 4;
  RunState state = 5;
  RunStats stats = 6;
}

message StartRunRequest {
  string project_id = 1;
}

message StartRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string id = 1;
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

// =====================================================
// Лента новостей
// =====================================================

message ListNewsRequest {
  string project_id = 1;
  // OR-фильтры: пустой список — не фильтровать по этому измерению.
  repeated NewsCategory categories = 2;
  repeated NewsImportance importances = 3;
  // Точное совпадение с одним из News.sources.
  string source = 4;
  // Диапазон по News.created_at. `from`/`to` не используем — `from` это ключевое
  // слово Python, а генератор оставляет его как есть.
  google.protobuf.Timestamp published_from = 5;
  google.protobuf.Timestamp published_to = 6;
  // Текстовый поиск по заголовку и содержимому.
  string q = 7;
  bool include_hidden = 8;
  int32 page_size = 9;
  string page_token = 10;
}

message ListNewsResponse {
  repeated News news = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message UpdateNewsRequest {
  int32 id = 1;
  string title = 2;
  string content = 3;
  NewsCategory category = 4;
  NewsImportance importance = 5;
  repeated string tags = 6;
  bool hidden = 7;
  // Обязательна: у hidden/title/tags пустое значение легитимно («показать обратно»,
  // «очистить теги») и без маски неотличимо от «поле не прислали».
  google.protobuf.FieldMask update_mask = 8;
}

message UpdateNewsResponse {
  News news = 1;
}

message CreateNewsRequest {
  string project_id = 1;
  string title = 2;
  string content = 3;
  NewsCategory category = 4;
  NewsImportance importance = 5;
  DocType doc_type = 6;
  repeated string tags = 7;
  repeated string sources = 8;
}

message CreateNewsResponse {
  News news = 1;
}

// =====================================================
// Сервисы
// =====================================================

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}

service RunService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
}

// Лента проекта: чтение с фильтрами, правка карточки, ручное добавление.
// Управления источниками здесь нет намеренно — это UpdateProject с
// update_mask: ["sources"] и новым массивом.
service NewsService {
  rpc ListNews(ListNewsRequest) returns (ListNewsResponse);
  rpc UpdateNews(UpdateNewsRequest) returns (UpdateNewsResponse);
  rpc CreateNews(CreateNewsRequest) returns (CreateNewsResponse);
}