name: ai-product-hack

x-api-env: &api-env
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  TG_FETCH_LIMIT: ${TG_FETCH_LIMIT:-100}
  TG_FETCH_DAYS: ${TG_FETCH_DAYS:-7}
  FILTER_BATCH: ${FILTER_BATCH:-30}
  NEWSMAKER_CAP: ${NEWSMAKER_CAP:-100}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *api-env
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: python -m app.worker.loop
    environment: *api-env
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./apps/web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
